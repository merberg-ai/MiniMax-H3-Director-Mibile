name: Build H3 Director Web UI

on:
  push:
    branches: [main]
    paths:
      - "webui/**"
      - "build-guard.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-webui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install UI dependencies
        working-directory: webui
        run: npm ci

      - name: Typecheck and guard
        run: node build-guard.js

      - name: Build single-file UI
        working-directory: webui
        run: npm run build

      - name: Commit built UI
        shell: bash
        run: |
          if git diff --quiet -- assets/index.html; then
            echo "assets/index.html is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/index.html
          git commit -m "build: update web UI bundle"
          git push
